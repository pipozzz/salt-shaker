# Weekly dependency updates. Minor and patch bumps are grouped into one PR per ecosystem;
# major versions come as separate PRs so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      # keep the Node typings on the runtime's major; bump them together with the node image and CI
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: weekly, day: monday }
    groups:
      docs:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']

  # the node base image in Dockerfile; images in the compose files are below
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directories: [/deploy, /lab]
    schedule: { interval: weekly, day: monday }
    ignore:
      # a new Postgres major can't read the old data directory; upgrading needs a dump/restore
      - dependency-name: postgres
        update-types: [version-update:semver-major]
