name: CI

on:
  # docs-only changes are handled by docs.yml; path filters don't apply to tag pushes,
  # so releases always build
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '.github/workflows/docs.yml', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '.github/workflows/docs.yml', '**.md']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # browser tests against the built UI in demo mode
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [check, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t salt-shaker:ci .
      - name: Smoke-test the image
        run: |
          # salt-api isn't needed to boot; the service account logs in on first use
          docker run -d --name ui -p 8080:8080 -e SALT_API_URL=http://salt-api.invalid:8000 -e SALT_API_USERNAME=x -e SALT_API_PASSWORD=x salt-shaker:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q '<title>Salt Shaker</title>'
          curl -fs localhost:8080/minions/web-01 | grep -q '<div id="root">'
          curl -fs localhost:8080/api/config | grep -q '"setupRequired":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/salt -H 'Content-Type: application/json' -d '{}')" = 401
          docker logs ui

  # pushes to main publish :latest and :sha-<short>; tags like v1.2.3 publish :1.2.3 and :1.2,
  # each for linux/amd64 and linux/arm64
  publish:
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # arm64 is built under emulation on the amd64 runner (Apple Silicon, Graviton, Raspberry Pi)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
