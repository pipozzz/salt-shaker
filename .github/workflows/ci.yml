name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t salt-shaker:ci .
      - name: Smoke-test the image
        run: |
          # salt-api isn't needed to boot; the service account logs in on first use
          docker run -d --name ui -p 8080:8080 -e SALT_API_URL=http://salt-api.invalid:8000 -e SALT_API_USERNAME=x -e SALT_API_PASSWORD=x salt-shaker:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q '<title>Salt Shaker</title>'
          curl -fs localhost:8080/minions/web-01 | grep -q '<div id="root">'
          curl -fs localhost:8080/api/config | grep -q '"setupRequired":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/salt -H 'Content-Type: application/json' -d '{}')" = 401
          docker logs ui

  # pushes to main publish :latest and :sha-<short>; tags like v1.2.3 publish :1.2.3 and :1.2
  publish:
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
