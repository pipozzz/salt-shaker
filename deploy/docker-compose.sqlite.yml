# Smallest production setup: Salt Shaker with SQLite, behind Caddy (automatic HTTPS).
#   cp .env.example .env   # then fill it in; POSTGRES_PASSWORD isn't used here
#   docker compose -f docker-compose.sqlite.yml up -d
# Point DNS for $DOMAIN at this host first; Caddy gets the certificate on start.
# For several instances or an external database, use docker-compose.yml (Postgres).
services:
  salt-shaker:
    image: ghcr.io/pipozzz/salt-shaker:${SALT_SHAKER_VERSION:-latest}
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}
      TRUST_PROXY: "1"
      # SQLite and the generated auth secret live in /data; back up this volume
      SALT_API_URL: ${SALT_API_URL}
      SALT_API_USERNAME: ${SALT_API_USERNAME}
      SALT_API_PASSWORD: ${SALT_API_PASSWORD}
      SALT_API_EAUTH: ${SALT_API_EAUTH:-sharedsecret}
      TZ: ${TZ:-UTC}
      # optional single sign-on; leave OIDC_ISSUER empty to use local accounts only
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-}
      OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-}
      OIDC_OPERATOR_GROUPS: ${OIDC_OPERATOR_GROUPS:-}
      OIDC_VIEWER_GROUPS: ${OIDC_VIEWER_GROUPS:-}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-all}
    volumes:
      - data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [salt-shaker]

volumes:
  data:
  caddy-data:
