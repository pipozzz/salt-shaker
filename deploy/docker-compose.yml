# Production example: Salt Shaker behind Caddy (automatic HTTPS) with Postgres.
#   cp .env.example .env   # then fill it in
#   docker compose up -d
# Point DNS for $DOMAIN at this host first; Caddy gets the certificate on start.
services:
  salt-shaker:
    image: ghcr.io/pipozzz/salt-shaker:${SALT_SHAKER_VERSION:-latest}
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}
      TRUST_PROXY: "1"
      DATABASE_URL: postgres://salt_shaker:${POSTGRES_PASSWORD}@postgres:5432/salt_shaker
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SALT_API_URL: ${SALT_API_URL}
      SALT_API_USERNAME: ${SALT_API_USERNAME}
      SALT_API_PASSWORD: ${SALT_API_PASSWORD}
      SALT_API_EAUTH: ${SALT_API_EAUTH:-pam}
      TZ: ${TZ:-UTC}
      # optional single sign-on; leave OIDC_ISSUER empty to use local accounts only
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-}
      OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-}
      OIDC_OPERATOR_GROUPS: ${OIDC_OPERATOR_GROUPS:-}
      OIDC_VIEWER_GROUPS: ${OIDC_VIEWER_GROUPS:-}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-all}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: salt_shaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: salt_shaker
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salt_shaker -d salt_shaker"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [salt-shaker]

volumes:
  postgres:
  caddy-data:
