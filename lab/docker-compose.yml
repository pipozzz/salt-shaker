# Local Salt lab: one master (with salt-api on :8000) and a few minions.
services:
  master:
    build: .
    hostname: master
    command: sh -c "salt-master -d && exec salt-api -l info"
    ports: ["8000:8000"]
    volumes:
      - ./master.conf:/etc/salt/master.d/lab.conf:ro
      - ./users.txt:/etc/salt/lab-users.txt:ro
      - ./srv:/srv:ro
      # keep the master's keys (and accepted minions) across container re-creation
      - master-pki:/etc/salt/pki/master
  # the production image (server + UI): http://localhost:8080, first visit creates the admin
  ui:
    build: ..
    environment:
      SALT_API_URL: http://master:8000
      SALT_API_USERNAME: shaker
      SALT_API_PASSWORD: shaker
      SALT_API_EAUTH: sharedsecret
      PUBLIC_URL: http://localhost:8080
    ports: ["8080:8080"]
    volumes:
      - ui-data:/data
    depends_on: [master]
  web-01: &minion
    build: .
    hostname: web-01
    command: sh -c "sleep 5 && exec salt-minion -l warning"
    environment: { SALT_MASTER: master }
    volumes:
      - ./minion.conf:/etc/salt/minion.d/lab.conf:ro
    depends_on: [master]
  web-02:
    <<: *minion
    hostname: web-02
  db-01:
    <<: *minion
    hostname: db-01

volumes:
  master-pki:
  ui-data:
