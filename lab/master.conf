interface: 0.0.0.0
auto_accept: False
file_roots:
  base: [/srv/salt]
pillar_roots:
  base: [/srv/pillar]

# Lab-only auth: log in as "shaker" with the shared secret as password, eauth "sharedsecret".
sharedsecret: shaker
external_auth:
  sharedsecret:
    shaker:
      - '.*'
      - '@wheel'
      - '@runner'
      - '@jobs'

rest_cherrypy:
  port: 8000
  host: 0.0.0.0
  disable_ssl: True

# Salt 3006+ disables all netapi clients by default.
netapi_enable_clients:
  - local
  - local_async
  - runner
  - wheel
