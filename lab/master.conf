interface: 0.0.0.0
auto_accept: False
file_roots:
  base: [/srv/salt]
pillar_roots:
  base: [/srv/pillar]

# Lab-only auth: log in as "shaker" with the shared secret as password, eauth "sharedsecret".
sharedsecret: shaker
external_auth:
  sharedsecret:
    shaker:
      - '.*'
      - '@wheel'
      - '@runner'
      - '@jobs'
  # Lab-only plaintext users (see users.txt); "viewer" is read-only, to try permission-aware UI.
  file:
    ^filename: /etc/salt/lab-users.txt
    ^filetype: text
    viewer:
      - test.ping
      - grains.*
      - pkg.list_upgrades
      - pkg.version
      - sys.list_functions
      - saltutil.find_job
      - '@runner':
        - manage.status
        - cache.grains
        - jobs.*
        - pillar.show_pillar
      - '@wheel':
        - key.list_all
        - key.finger
        - file_roots.*
        - pillar_roots.*

rest_cherrypy:
  port: 8000
  host: 0.0.0.0
  disable_ssl: True

# Salt 3006+ disables all netapi clients by default.
netapi_enable_clients:
  - local
  - local_async
  - runner
  - runner_async
  - wheel
